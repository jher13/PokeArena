name: Deploy PokeArena backend
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-supabase.yml'
      - 'supabase/functions/arena-combat/**'
      - 'supabase/migrations/**'

permissions:
  contents: read
concurrency:
  group: pokearena-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: ckgcuhaiuwlccyaxewbv
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
      - name: Check deployment credentials
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?Add the SUPABASE_ACCESS_TOKEN repository secret}"
          : "${SUPABASE_DB_PASSWORD:?Add the SUPABASE_DB_PASSWORD repository secret}"
      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply database migrations
        run: supabase db push --yes
      - name: Deploy arena combat
        run: supabase functions deploy arena-combat --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
